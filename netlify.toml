# Netlify builds the public site from source/ and publishes only the launch build (see START-HERE.md).
# build:launch strips the review portal, Codex and internal notes from the output (tools/prune-launch.mjs).
[build]
  base = "source"
  command = "npm run build:launch"
  publish = "dist-launch"

[build.environment]
  NODE_VERSION = "22"
